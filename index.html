<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAITING ROOM</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪑</text></svg>">
  
  <!-- Are.na / Design Twitter Inspired Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- Frames 1-6: Big iOS-style segmented loading spinner with text inside -->
    <div id="spinner-box" class="spinner-box">
      <svg id="spinner-svg" class="spinner-svg" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
        <g class="spinner-blades">
          <line x1="300" y1="28" x2="300" y2="100" stroke="#000000" stroke-width="24" stroke-linecap="round" opacity="1.0" transform="rotate(0 300 300)" />
          <line x1="300" y1="28" x2="300" y2="100" stroke="#000000" stroke-width="24" stroke-linecap="round" opacity="0.88" transform="rotate(30 300 300)" />
          <line x1="300" y1="28" x2="300" y2="100" stroke="#000000" stroke-width="24" stroke-linecap="round" opacity="0.76" transform="rotate(60 300 300)" />
          <line x1="300" y1="28" x2="300" y2="100" stroke="#000000" stroke-width="24" stroke-linecap="round" opacity="0.64" transform="rotate(90 300 300)" />
          <line x1="300" y1="28" x2="300" y2="100" stroke="#000000" stroke-width="24" stroke-linecap="round" opacity="0.52" transform="rotate(120 300 300)" />
          <line x1="300" y1="28" x2="300" y2="100" stroke="#000000" stroke-width="24" stroke-linecap="round" opacity="0.40" transform="rotate(150 300 300)" />
          <line x1="300" y1="28" x2="300" y2="100" stroke="#000000" stroke-width="24" stroke-linecap="round" opacity="0.30" transform="rotate(180 300 300)" />
          <line x1="300" y1="28" x2="300" y2="100" stroke="#000000" stroke-width="24" stroke-linecap="round" opacity="0.22" transform="rotate(210 300 300)" />
          <line x1="300" y1="28" x2="300" y2="100" stroke="#000000" stroke-width="24" stroke-linecap="round" opacity="0.15" transform="rotate(240 300 300)" />
          <line x1="300" y1="28" x2="300" y2="100" stroke="#000000" stroke-width="24" stroke-linecap="round" opacity="0.10" transform="rotate(270 300 300)" />
          <line x1="300" y1="28" x2="300" y2="100" stroke="#000000" stroke-width="24" stroke-linecap="round" opacity="0.06" transform="rotate(300 300 300)" />
          <line x1="300" y1="28" x2="300" y2="100" stroke="#000000" stroke-width="24" stroke-linecap="round" opacity="0.03" transform="rotate(330 300 300)" />
        </g>
      </svg>
      <div id="spinner-text" class="spinner-text"></div>
    </div>

    <!-- Frame 7: WAITING ROOM -->
    <div id="title-box" class="title-box">
      <div>WAITING</div>
      <div>ROOM</div>
    </div>

    <!-- Frame 8: Manifesto text (typed in sequentially) -->
    <div id="manifesto-box" class="manifesto-box"></div>
    <div id="manifesto-footer" class="manifesto-footer" style="display: none;"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
